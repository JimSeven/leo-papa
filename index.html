<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leopolds Spiel</title>
    <link rel="icon" href="./favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000; /* nur bis spiel.js die echte Farbe setzt */
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="bild"></canvas>

    <script type="module">
      // Der Zeitstempel umgeht den Browser-Cache: GitHub Pages lässt Dateien
      // zehn Minuten lang zwischenspeichern, und Leopold bekäme sonst nach dem
      // Veröffentlichen stumm die alte Version zu sehen.
      import(`./spiel.js?stand=${Date.now()}`);
    </script>

    <script>
      // Lädt die Seite neu, sobald der Dev-Server eine Änderung meldet.
      // Nur beim Bauen — im veröffentlichten Spiel gibt es keinen Dev-Server,
      // und die Verbindung würde sich endlos neu aufbauen. Der Port ist das
      // verlässliche Zeichen: der Dev-Server hat immer einen, Pages nie.
      if (location.port) {
        new EventSource("/neu-laden").onmessage = () => location.reload();
      }
    </script>
  </body>
</html>
