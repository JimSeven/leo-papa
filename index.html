<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leopolds Spiel</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000; /* nur bis spiel.js die echte Farbe setzt */
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="bild"></canvas>

    <script type="module" src="./spiel.js"></script>

    <script>
      // Lädt die Seite neu, sobald der Dev-Server eine Änderung meldet.
      // Nur beim Bauen — im veröffentlichten Spiel gibt es keinen Dev-Server,
      // und die Verbindung würde sich endlos neu aufbauen.
      if (["localhost", "127.0.0.1"].includes(location.hostname)) {
        new EventSource("/neu-laden").onmessage = () => location.reload();
      }
    </script>
  </body>
</html>
