<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leopolds Spiel</title>
    <link rel="icon" href="./favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000; /* nur bis spiel.js die echte Farbe setzt */
      }
      canvas {
        display: block;
      }

      /* Leopolds Ideenliste, Taste i. Bewusst DOM statt Canvas: Zeilenumbruch,
         Scrollen und Emoji gibt es hier geschenkt. */
      #ideen {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        background: rgba(16, 19, 26, 0.97); /* dieselbe Farbe wie HINTERGRUND */
        color: #e8ecf4;
        font: 26px/1.5 system-ui, sans-serif;
      }
      #ideen .blatt {
        max-width: 26em;
        margin: 0 auto;
        padding: 8vh 6vw;
      }
      #ideen .naechstes {
        margin: 0 0 2em;
        color: #ffd23f;
      }
      #ideen h1 {
        margin: 0 0 1em;
        font-size: 1.4em;
      }
      #ideen ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #ideen li {
        margin: 0.7em 0;
      }
      #ideen li::before {
        content: "⬜";
        margin-right: 0.5em;
      }
      #ideen li.fertig {
        color: #7d8598;
      }
      #ideen li.fertig::before {
        content: "✅";
      }
      #ideen .leer {
        margin: 0;
        color: #7d8598;
      }

      /* Controller-Diagnose, Taste g. Nur für Papa. */
      #diagnose {
        position: fixed;
        top: 0;
        left: 0;
        margin: 0;
        padding: 1em 1.2em;
        max-width: 100%;
        overflow-x: auto;
        background: rgba(0, 0, 0, 0.85);
        color: #9ef01a;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre;
        pointer-events: none; /* nie im Weg beim Spielen */
      }
    </style>
  </head>
  <body>
    <canvas id="bild"></canvas>

    <pre id="diagnose" hidden></pre>

    <div id="ideen" hidden>
      <div class="blatt">
        <p class="naechstes" hidden></p>
        <h1>Das bauen wir noch</h1>
        <ul></ul>
        <p class="leer">Hier landen deine Ideen, die wir noch bauen.</p>
      </div>
    </div>

    <script type="module">
      // Der Zeitstempel umgeht den Browser-Cache: GitHub Pages lässt Dateien
      // zehn Minuten lang zwischenspeichern, und Leopold bekäme sonst nach dem
      // Veröffentlichen stumm die alte Version zu sehen.
      import(`./spiel.js?stand=${Date.now()}`);
    </script>

    <script>
      // Lädt die Seite neu, sobald der Dev-Server eine Änderung meldet.
      // Nur beim Bauen — im veröffentlichten Spiel gibt es keinen Dev-Server,
      // und die Verbindung würde sich endlos neu aufbauen. Der Port ist das
      // verlässliche Zeichen: der Dev-Server hat immer einen, Pages nie.
      if (location.port) {
        new EventSource("/neu-laden").onmessage = () => location.reload();
      }
    </script>
  </body>
</html>
